<title>制作ツール — YouTube Production</title>
<style>
  :root {
    --bg: #15130f;
    --surface: #1f1b14;
    --surface-2: #262019;
    --surface-3: #2c2620;
    --border: #3a3226;
    --text: #f1ece0;
    --text-dim: #b8ad98;
    --text-faint: #8a8069;
    --accent: #e8a33d;
    --accent-strong: #f5c065;
    --ok: #5fa777;
    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f1e7;
      --surface: #ffffff;
      --surface-2: #fbf7ee;
      --surface-3: #f2ead9;
      --border: #e1d8c4;
      --text: #221d14;
      --text-dim: #6b6152;
      --text-faint: #8c8064;
      --accent: #b9791f;
      --accent-strong: #8f5e14;
      --ok: #3f8557;
      color-scheme: light;
    }
  }

  :root[data-theme="dark"] {
    --bg: #15130f;
    --surface: #1f1b14;
    --surface-2: #262019;
    --surface-3: #2c2620;
    --border: #3a3226;
    --text: #f1ece0;
    --text-dim: #b8ad98;
    --text-faint: #8a8069;
    --accent: #e8a33d;
    --accent-strong: #f5c065;
    --ok: #5fa777;
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #f6f1e7;
    --surface: #ffffff;
    --surface-2: #fbf7ee;
    --surface-3: #f2ead9;
    --border: #e1d8c4;
    --text: #221d14;
    --text-dim: #6b6152;
    --text-faint: #8c8064;
    --accent: #b9791f;
    --accent-strong: #8f5e14;
    --ok: #3f8557;
    color-scheme: light;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono",
      Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Shell ---------- */

  .shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 26px 24px 60px;
  }

  header.top {
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .eyebrow {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .top p {
    margin: 0;
    font-size: 13px;
    color: var(--text-dim);
    max-width: 62ch;
    line-height: 1.7;
  }

  /* ---------- Layout: sidebar + panel ---------- */

  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 22px;
    align-items: start;
  }

  @media (max-width: 720px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  nav.tools {
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: sticky;
    top: 20px;
  }

  @media (max-width: 720px) {
    nav.tools {
      position: static;
      flex-direction: row;
      flex-wrap: wrap;
    }
  }

  .tool-tab {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    text-align: left;
    padding: 10px 11px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .tool-tab .no {
    font-size: 10.5px;
    color: var(--text-faint);
    flex: none;
  }

  .tool-tab:hover {
    background: var(--surface-2);
    color: var(--text);
  }

  .tool-tab[aria-selected="true"] {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text);
    font-weight: 600;
  }

  .tool-tab[aria-selected="true"] .no {
    color: var(--accent);
  }

  /* ---------- Panel ---------- */

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 22px 24px 24px;
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }

  .panel-head .no {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
  }

  .panel-head h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  .panel-blurb {
    margin: 0 0 20px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
    max-width: 60ch;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
  }

  .field .optional {
    text-transform: none;
    letter-spacing: 0;
    color: var(--text-faint);
    font-size: 10.5px;
  }

  .field input[type="text"],
  .field textarea,
  .field select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    padding: 9px 10px;
    resize: vertical;
  }

  .field textarea {
    min-height: 78px;
    line-height: 1.55;
  }

  .field input:focus,
  .field textarea:focus,
  .field select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .checkbox-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
  }

  @media (max-width: 480px) {
    .checkbox-grid {
      grid-template-columns: 1fr;
    }
  }

  .checkbox-item {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 9px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--text-dim);
  }

  .checkbox-item input {
    margin-top: 2px;
    flex: none;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  button.generate {
    appearance: none;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--bg);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 4px;
    cursor: pointer;
  }

  button.generate:hover {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }

  .copied-msg {
    font-size: 12px;
    color: var(--ok);
    display: none;
  }

  .copied-msg.show {
    display: block;
  }

  .fallback-wrap {
    margin-top: 14px;
    display: none;
  }

  .fallback-wrap.show {
    display: block;
  }

  .fallback-wrap p {
    margin: 0 0 6px;
    font-size: 11.5px;
    color: var(--text-faint);
  }

  .fallback-wrap textarea {
    width: 100%;
    min-height: 120px;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono",
      Menlo, Consolas, monospace;
    font-size: 11.5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 9px 10px;
  }

  .howto {
    margin-top: 22px;
    padding: 12px 14px;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11.5px;
    color: var(--text-faint);
    line-height: 1.6;
  }

  .howto strong {
    color: var(--text-dim);
  }
</style>

<div class="shell">
  <header class="top">
    <span class="eyebrow">daiki — youtube production</span>
    <h1>制作ツール</h1>
    <p>
      工程を選んで入力すると、Claude Codeのチャットに貼り付けるための指示文が作れます。貼り付けると、

<script>
  (function () {
    var TOOLS = JSON.parse(document.getElementById("tools-data").textContent);
    var toolsNav = document.getElementById("tools");
    var panel = document.getElementById("panel");
    var state = {}; // id -> { fieldKey: value }
    var activeId = TOOLS[0].id;

    TOOLS.forEach(function (t) {
      state[t.id] = {};
    });

    function renderNav() {
      toolsNav.innerHTML = "";
      TOOLS.forEach(function (t) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tool-tab";
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", t.id === activeId ? "true" : "false");
        btn.innerHTML =
          '<span class="no mono">' + t.no + "</span><span>" + t.title + "</span>";
        btn.addEventListener("click", function () {
          activeId = t.id;
          renderNav();
          renderPanel();
        });
        toolsNav.appendChild(btn);
      });
    }

    function fieldValueLabel(field, raw) {
      if (field.type === "checkboxes") {
        return (raw || []).join("、");
      }
      return (raw || "").trim();
    }

    function buildMessage(tool) {
      var lines = [tool.instruction];
      tool.fields.forEach(function (f) {
        var val = fieldValueLabel(f, state[tool.id][f.key]);
        if (!val) return;
        if (f.type === "select" && val === "おまかせ") return;
        lines.push(f.label + ": " + val);
      });
      return lines.join("\n");
    }

    function requiredFilled(tool) {
      return tool.fields
        .filter(function (f) {
          return f.required;
        })
        .every(function (f) {
          return fieldValueLabel(f, state[tool.id][f.key]).length > 0;
        });
    }

    function renderPanel() {
      var tool = TOOLS.filter(function (t) {
        return t.id === activeId;
      })[0];

      panel.innerHTML = "";

      var head = document.createElement("div");
      head.className = "panel-head";
      head.innerHTML =
        '<span class="no mono">' +
        tool.no +
        "</span><h2>" +
        tool.title +
        "</h2>";
      panel.appendChild(head);

      var blurb = document.createElement("p");
      blurb.className = "panel-blurb";
      blurb.textContent = tool.blurb;
      panel.appendChild(blurb);

      tool.fields.forEach(function (f) {
        var wrap = document.createElement("div");
        wrap.className = "field";

        var label = document.createElement("label");
        label.textContent = f.label + (f.required ? "" : "");
        if (f.optional) {
          var span = document.createElement("span");
          span.className = "optional";
          span.textContent = "（任意）";
          label.appendChild(document.createTextNode(" "));
          label.appendChild(span);
        }
        wrap.appendChild(label);

        if (f.type === "textarea") {
          var ta = document.createElement("textarea");
          ta.placeholder = f.placeholder || "";
          ta.value = state[tool.id][f.key] || "";
          ta.addEventListener("input", function () {
            state[tool.id][f.key] = ta.value;
          });
          wrap.appendChild(ta);
        } else if (f.type === "select") {
          var sel = document.createElement("select");
          f.options.forEach(function (opt) {
            var o = document.createElement("option");
            o.value = opt;
            o.textContent = opt;
            sel.appendChild(o);
          });
          sel.value = state[tool.id][f.key] || f.options[0];
          state[tool.id][f.key] = sel.value;
          sel.addEventListener("change", function () {
            state[tool.id][f.key] = sel.value;
          });
          wrap.appendChild(sel);
        } else if (f.type === "checkboxes") {
          var grid = document.createElement("div");
          grid.className = "checkbox-grid";
          var current = state[tool.id][f.key] || [];
          f.options.forEach(function (opt) {
            var item = document.createElement("label");
            item.className = "checkbox-item";
            var cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = current.indexOf(opt) !== -1;
            cb.addEventListener("change", function () {
              var arr = state[tool.id][f.key] || [];
              if (cb.checked) {
                if (arr.indexOf(opt) === -1) arr.push(opt);
              } else {
                arr = arr.filter(function (x) {
                  return x !== opt;
                });
              }
              state[tool.id][f.key] = arr;
            });
            item.appendChild(cb);
            item.appendChild(document.createTextNode(opt));
            grid.appendChild(item);
          });
          wrap.appendChild(grid);
        } else {
          var input = document.createElement("input");
          input.type = "text";
          input.placeholder = f.placeholder || "";
          input.value = state[tool.id][f.key] || "";
          input.addEventListener("input", function () {
            state[tool.id][f.key] = input.value;
          });
          wrap.appendChild(input);
        }

        panel.appendChild(wrap);
      });

      var actions = document.createElement("div");
      actions.className = "actions";
      var genBtn = document.createElement("button");
      genBtn.type = "button";
      genBtn.className = "generate";
      genBtn.textContent = "コピーしてClaude Codeに貼り付ける";
      var copiedMsg = document.createElement("span");
      copiedMsg.className = "copied-msg";
      copiedMsg.textContent = "コピーしました。チャットに貼り付けてください。";
      actions.appendChild(genBtn);
      actions.appendChild(copiedMsg);
      panel.appendChild(actions);

      var fallbackWrap = document.createElement("div");
      fallbackWrap.className = "fallback-wrap";
      fallbackWrap.innerHTML =
        "<p>自動コピーができなかったので、下のテキストを選択してコピーしてください。</p>" +
        "<textarea readonly></textarea>";
      panel.appendChild(fallbackWrap);

      genBtn.addEventListener("click", function () {
        if (!requiredFilled(tool)) {
          var firstRequired = tool.fields.filter(function (f) {
            return f.required;
          })[0];
          var el = panel.querySelector(
            firstRequired.type === "textarea" ? "textarea" : "input"
          );
          if (el) el.focus();
          return;
        }
        var message = buildMessage(tool);
        var fbTextarea = fallbackWrap.querySelector("textarea");

        function showCopied() {
          copiedMsg.classList.add("show");
          fallbackWrap.classList.remove("show");
        }
        function showFallback() {
          fbTextarea.value = message;
          fallbackWrap.classList.add("show");
          fbTextarea.focus();
          fbTextarea.select();
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(message).then(showCopied, showFallback);
        } else {
          showFallback();
        }
      });

      var howto = document.createElement("div");
      howto.className = "howto";
      howto.innerHTML =
        "<strong>使い方</strong>：入力してコピーしたら、このツールを開いているのと同じClaude Codeのチャットに貼り付けて送信。" +
        "そのチャットが、このリポジトリのYouTube制作ノウハウとvidIQのリサーチツールを踏まえて実際に案を返します。";
      panel.appendChild(howto);
    }

    renderNav();
    renderPanel();
  })();
</script>
