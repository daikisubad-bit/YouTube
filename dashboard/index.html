<title>制作進行ボード — YouTube Production</title>
<style>
  :root {
    --bg: #15130f;
    --surface: #1f1b14;
    --surface-2: #262019;
    --border: #3a3226;
    --text: #f1ece0;
    --text-dim: #b8ad98;
    --text-faint: #8a8069;
    --accent: #e8a33d;
    --accent-strong: #f5c065;
    --ok: #5fa777;
    --wait: #7c8aa8;
    --rec: #d64545;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f1e7;
      --surface: #ffffff;
      --surface-2: #fbf7ee;
      --border: #e1d8c4;
      --text: #221d14;
      --text-dim: #6b6152;
      --text-faint: #8c8064;
      --accent: #b9791f;
      --accent-strong: #8f5e14;
      --ok: #3f8557;
      --wait: #5a6b8c;
      --rec: #b23636;
      --shadow: 0 1px 0 rgba(0, 0, 0, 0.05);
      color-scheme: light;
    }
  }

  :root[data-theme="dark"] {
    --bg: #15130f;
    --surface: #1f1b14;
    --surface-2: #262019;
    --border: #3a3226;
    --text: #f1ece0;
    --text-dim: #b8ad98;
    --text-faint: #8a8069;
    --accent: #e8a33d;
    --accent-strong: #f5c065;
    --ok: #5fa777;
    --wait: #7c8aa8;
    --rec: #d64545;
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #f6f1e7;
    --surface: #ffffff;
    --surface-2: #fbf7ee;
    --border: #e1d8c4;
    --text: #221d14;
    --text-dim: #6b6152;
    --text-faint: #8c8064;
    --accent: #b9791f;
    --accent-strong: #8f5e14;
    --ok: #3f8557;
    --wait: #5a6b8c;
    --rec: #b23636;
    color-scheme: light;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono",
      Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  a {
    color: inherit;
  }

  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  /* ---------- Header ---------- */

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .eyebrow {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .meta-block {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .timecode {
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.02em;
  }

  .timecode span {
    color: var(--text-dim);
  }

  .counts {
    display: flex;
    gap: 14px;
  }

  .count-chip {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  .count-chip .n {
    font-size: 15px;
    font-weight: 700;
  }

  .count-chip .label {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  /* ---------- Legend ---------- */

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 22px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-faint);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
  }

  .dot.rec {
    background: var(--rec);
  }
  .dot.wait {
    background: var(--wait);
  }
  .dot.ok {
    background: var(--ok);
  }
  .dot.idle {
    background: var(--text-faint);
  }

  /* ---------- Board ---------- */

  .board-scroll {
    overflow-x: auto;
    padding-bottom: 8px;
    margin: 0 -24px;
    padding-left: 24px;
    padding-right: 24px;
  }

  .board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 250px;
    gap: 14px;
    align-items: start;
  }

  .column {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    min-height: 180px;
    display: flex;
    flex-direction: column;
  }

  .column-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 12px 12px 10px;
    border-bottom: 1px solid var(--border);
  }

  .column-head .idx {
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
  }

  .column-head .name {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-dim);
    flex: 1;
  }

  .column-head .count {
    font-size: 11px;
    color: var(--text-faint);
  }

  .add-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    width: 20px;
    height: 20px;
    line-height: 1;
    border-radius: 3px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    transition: border-color 0.12s ease, color 0.12s ease;
  }

  .add-btn:hover,
  .add-btn:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  .add-btn[aria-expanded="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .column-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  /* ---------- Add-project form ---------- */

  .add-form {
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 9px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .add-form label {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .add-form input,
  .add-form textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    padding: 6px 7px;
    resize: vertical;
  }

  .add-form textarea {
    min-height: 44px;
  }

  .add-form input:focus,
  .add-form textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .add-form .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .add-form .actions {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }

  .add-form button {
    appearance: none;
    border-radius: 3px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 10px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
  }

  .add-form button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    flex: 1;
  }

  .add-form button.primary:hover {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }

  .add-form .hint {
    font-size: 10.5px;
    color: var(--text-faint);
    line-height: 1.5;
    margin: 0;
  }

  .add-form .copied {
    font-size: 10.5px;
    color: var(--ok);
    display: none;
  }

  .add-form .copied.show {
    display: block;
  }

  .add-form .fallback {
    width: 100%;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono",
      Menlo, Consolas, monospace;
    font-size: 11px;
    min-height: 70px;
    display: none;
  }

  .add-form .fallback.show {
    display: block;
  }

  /* ---------- Cards ---------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 11px;
    box-shadow: var(--shadow);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 6px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
  }

  .card-status {
    font-size: 11.5px;
    color: var(--text-dim);
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--text-faint);
  }

  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--rec);
    flex: none;
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .pulse {
      animation: pulse 1.8s ease-in-out infinite;
    }
  }

  @keyframes pulse {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.35;
    }
  }

  /* ---------- Empty states ---------- */

  .column-empty {
    border: 1px dashed var(--border);
    border-radius: 3px;
    padding: 14px 11px;
    font-size: 11.5px;
    color: var(--text-faint);
    text-align: center;
    line-height: 1.5;
  }

  .onboard {
    grid-column: 1 / -1;
    max-width: 640px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }

  .onboard h2 {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 700;
  }

  .onboard p {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
  }

  .onboard p:last-child {
    margin-bottom: 0;
  }

  .onboard code {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono",
      Menlo, Consolas, monospace;
    font-size: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>

<div class="page">
  <header class="topbar">
    <div class="title-block">
      <span class="eyebrow">daiki — youtube production</span>
      <h1>制作進行ボード</h1>
    </div>
    <div class="meta-block">
      <div class="timecode">最終更新 <span id="updatedAt" class="mono"></span></div>
      <div class="counts" id="counts"></div>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item"><span class="dot rec"></span>直近のセッションで作業中</div>
    <div class="legend-item"><span class="dot wait"></span>相手待ち・保留</div>
    <div class="legend-item"><span class="dot ok"></span>公開済み</div>
    <div class="legend-item"><span class="dot idle"></span>その他</div>
  </div>

  <div class="board-scroll">
    <div class="board" id="board"></div>
  </div>
</div>

<script id="dashboard-data" type="application/json">
{
  "generatedAt": "2026-08-01",
  "stages": [
    { "idx": 0, "name": "チャンネル基盤" },
    { "idx": 1, "name": "リサーチ" },
    { "idx": 2, "name": "企画" },
    { "idx": 3, "name": "タイトル・サムネ" },
    { "idx": 4, "name": "差別化ポイント" },
    { "idx": 5, "name": "台本" },
    { "idx": 6, "name": "公開後" }
  ],
  "projects": []
}
</script>

<script>
  (function () {
    var data = JSON.parse(
      document.getElementById("dashboard-data").textContent
    );

    document.getElementById("updatedAt").textContent = data.generatedAt;

    var board = document.getElementById("board");
    var byStage = {};
    data.stages.forEach(function (s) {
      byStage[s.idx] = [];
    });
    data.projects.forEach(function (p) {
      (byStage[p.stage] || (byStage[p.stage] = [])).push(p);
    });

    function statusDotClass(p) {
      if (p.active) return "rec";
      if (p.stage === 6) return "ok";
      if (p.status && p.status.indexOf("待ち") !== -1) return "wait";
      return "idle";
    }

    if (data.projects.length === 0) {
      var onboard = document.createElement("div");
      onboard.className = "onboard";
      onboard.innerHTML =
        "<h2>まだ動画プロジェクトはありません</h2>" +
        "<p>各列の見出しにある「＋」ボタンでタイトルを入力し、コピーしたテキストをClaude Codeのチャットに貼り付けると、" +
        "<code>projects/</code> に進行ファイルが作られてこのボードにカードが追加されます（このボードはClaudeが" +
        "会話のたびに再publishするスナップショットなので、その場では反映されません）。</p>" +
        "<p>もちろん「＋」を使わず、テーマを直接チャットで話しかけてもOKです。</p>";
      board.appendChild(onboard);
    }

    data.stages.forEach(function (stage) {
      var col = document.createElement("div");
      col.className = "column";

      var items = byStage[stage.idx] || [];

      var head = document.createElement("div");
      head.className = "column-head";
      head.innerHTML =
        '<span class="idx mono">' +
        String(stage.idx).padStart(2, "0") +
        "</span>" +
        '<span class="name">' +
        stage.name +
        "</span>" +
        '<span class="count mono">' +
        items.length +
        "</span>" +
        '<button type="button" class="add-btn" data-stage-idx="' +
        stage.idx +
        '" data-stage-name="' +
        stage.name +
        '" aria-expanded="false" title="この工程で新しい動画を追加">+</button>';
      col.appendChild(head);

      var body = document.createElement("div");
      body.className = "column-body";

      if (items.length === 0) {
        var empty = document.createElement("div");
        empty.className = "column-empty";
        empty.textContent = "—";
        body.appendChild(empty);
      } else {
        items.forEach(function (p) {
          var card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            '<div class="card-top">' +
            '<div class="card-title">' +
            p.title +
            "</div>" +
            '<span class="' +
            (p.active ? "pulse" : "dot " + statusDotClass(p)) +
            '"></span>' +
            "</div>" +
            '<div class="card-status">' +
            (p.status || "") +
            "</div>" +
            '<div class="card-foot">' +
            '<span class="mono">' +
            (p.updatedAt || "") +
            "</span>" +
            "<span>" +
            (p.nextAction || "") +
            "</span>" +
            "</div>";
          body.appendChild(card);
        });
      }

      col.appendChild(body);
      board.appendChild(col);
    });

    function slugify(title) {
      var base = title
        .trim()
        .toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, "-")
        .replace(/^-+|-+$/g, "");
      return base || "video";
    }

    function buildMessage(stageIdx, stageName, title, memo) {
      var lines = [
        "新しい動画プロジェクトを追加してください。",
        "タイトル: " + title,
        "現在の工程: " + stageIdx + ". " + stageName,
        "スラッグ案: " + slugify(title),
      ];
      if (memo) lines.push("メモ: " + memo);
      return lines.join("\n");
    }

    function closeOpenForms() {
      board.querySelectorAll(".add-form").forEach(function (f) {
        f.remove();
      });
      board.querySelectorAll('.add-btn[aria-expanded="true"]').forEach(
        function (b) {
          b.setAttribute("aria-expanded", "false");
        }
      );
    }

    board.addEventListener("click", function (e) {
      var btn = e.target.closest(".add-btn");
      if (!btn) return;

      var wasOpen = btn.getAttribute("aria-expanded") === "true";
      closeOpenForms();
      if (wasOpen) return;

      btn.setAttribute("aria-expanded", "true");
      var stageIdx = btn.getAttribute("data-stage-idx");
      var stageName = btn.getAttribute("data-stage-name");
      var body = btn.closest(".column").querySelector(".column-body");

      var form = document.createElement("div");
      form.className = "add-form";
      form.innerHTML =
        '<p class="hint">タイトルを入力して「チャットに貼るテキストをコピー」を押し、' +
        "このボードはClaudeがチャットでの会話をもとに更新する方式なので、コピーした内容をこのプロジェクトの" +
        "Claude Codeセッションに貼り付けて送ってください。</p>" +
        '<div class="field"><label>動画タイトル</label>' +
        '<input type="text" class="add-title" placeholder="例：〇〇の始め方" /></div>' +
        '<div class="field"><label>メモ（任意）</label>' +
        '<textarea class="add-memo" placeholder="切り口・参考動画など"></textarea></div>' +
        '<div class="actions">' +
        '<button type="button" class="primary add-copy">チャットに貼るテキストをコピー</button>' +
        '<button type="button" class="add-cancel">キャンセル</button>' +
        "</div>" +
        '<p class="copied">コピーしました。Claude Codeのチャットに貼り付けてください。</p>' +
        '<textarea class="fallback" readonly></textarea>';

      body.insertBefore(form, body.firstChild);
      form.querySelector(".add-title").focus();

      form.querySelector(".add-cancel").addEventListener("click", function () {
        closeOpenForms();
      });

      form.querySelector(".add-copy").addEventListener("click", function () {
        var title = form.querySelector(".add-title").value.trim();
        if (!title) {
          form.querySelector(".add-title").focus();
          return;
        }
        var memo = form.querySelector(".add-memo").value.trim();
        var message = buildMessage(stageIdx, stageName, title, memo);
        var copiedEl = form.querySelector(".copied");
        var fallbackEl = form.querySelector(".fallback");

        function showCopied() {
          copiedEl.classList.add("show");
          fallbackEl.classList.remove("show");
        }

        function showFallback() {
          fallbackEl.value = message;
          fallbackEl.classList.add("show");
          fallbackEl.focus();
          fallbackEl.select();
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(message).then(showCopied, showFallback);
        } else {
          showFallback();
        }
      });
    });

    var counts = document.getElementById("counts");
    var total = data.projects.length;
    var published = (byStage[6] || []).length;
    var inProgress = total - published;
    counts.innerHTML =
      '<div class="count-chip"><span class="n mono">' +
      total +
      '</span><span class="label">total</span></div>' +
      '<div class="count-chip"><span class="n mono">' +
      inProgress +
      '</span><span class="label">進行中</span></div>' +
      '<div class="count-chip"><span class="n mono">' +
      published +
      '</span><span class="label">公開済み</span></div>';
  })();
</script>
